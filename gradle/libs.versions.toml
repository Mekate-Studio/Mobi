# Temporary shared version catalog for the iOS Gradle bridge.
# Keep this intentionally small so it is easy to remove once Kotlin Toolchain
# can own the full iOS path for this repo.

[versions]
kotlin = "2.3.20"
compose = "1.9.0"
metro = "1.1.1"
coroutines = "1.11.0"
skie = "0.10.12"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }

[libraries]
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

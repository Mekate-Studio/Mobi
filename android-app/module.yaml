product: android/app

dependencies:
  - ../shared-core
  - ../shared-di
  - ../shared-feature-home
  - ../shared-feature-nearby-vehicle-map
  - ../shared-ui-home
  - androidx.activity:activity-compose:1.13.0
  - androidx.lifecycle:lifecycle-runtime-compose:2.11.0
  - com.slack.circuit:circuit-foundation:0.39.0
  - dev.zacsweers.metro:runtime:1.4.5
  - org.maplibre.gl:android-sdk:13.7.1

test-dependencies:
  - com.slack.circuit:circuit-test:0.39.0
  - org.robolectric:robolectric:4.17
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  compose: enabled
  junit: junit-4
  jvm:
    test:
      freeJvmArgs:
        # Robolectric loads native Android runtime code in host tests.
        - --enable-native-access=ALL-UNNAMED
  kotlin:
    compilerPlugins:
      - id: dev.zacsweers.metro.compiler
        dependency: dev.zacsweers.metro:compiler:1.4.5
  android:
    namespace: studio.mekate.mobi
    applicationId: studio.mekate.mobi
    minSdk: 36
    compileSdk: 37
    targetSdk: 36
    signing:
      enabled: true
      propertiesFile: ./keystore.properties
    versionCode: 1
    versionName: "1.0-local"

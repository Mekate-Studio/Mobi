			shellScript = "set -eu\nAmperFrameworksDir=\"${TARGET_BUILD_DIR}/AmperFrameworks\"\nAppFrameworksDir=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nStampFile=\"${TARGET_TEMP_DIR}/.amper-embed-stamp\"\nLegacyStampFile=\"${AppFrameworksDir}/.amper-embed-stamp\"\n\nmkdir -p \"${AppFrameworksDir}\"\nmkdir -p \"$(dirname \"${StampFile}\")\"\n/bin/rm -f \"${LegacyStampFile}\"\n\nif [ -d \"${AmperFrameworksDir}\" ]; then\n  for framework in \"${AmperFrameworksDir}\"/*.framework; do\n    [ -e \"${framework}\" ] || continue\n\n    framework_name=\"$(basename \"${framework}\")\"\n    executable_name=\"$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \"${framework}/Info.plist\" 2>/dev/null || basename \"${framework}\" .framework)\"\n    binary_path=\"${framework}/${executable_name}\"\n    file_output=\"$(/usr/bin/file \"${binary_path}\" 2>/dev/null || true)\"\n\n    case \"${file_output}\" in\n      *\"dynamically linked shared library\"*)\n        /usr/bin/rsync -aL \"${framework}/\" \"${AppFrameworksDir}/${framework_name}/\"\n        if [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n          /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --generate-entitlement-der \"${AppFrameworksDir}/${framework_name}\"\n        fi\n        ;;\n      *)\n        echo \"Skipping static framework ${framework_name}\"\n        ;;\n    esac\n  done\n\n  /bin/rm -rf \"${AmperFrameworksDir}\"\nfi\n\n/usr/bin/touch \"${StampFile}\"\n";

name: Manual Direct Operations Assessment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-direct-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct_operations:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install and verify repository-locked tools without a repository cache restore
        run: ./scripts/ci/install_quality_tools.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""
      - name: Prepare reviewed Kotlin distributions
        run: ./scripts/dev/dependency_updates.sh prepare-kotlin
      - name: Assess paired unsigned operations with owned recovery
        run: ./docs/maintenance/evidence/probes/run_direct_operations.sh
      - name: Retain bounded summary and raw producer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-operations-evidence
          path: |
            .maintenance/direct-operations-summary
            .maintenance/runs-ios-operations
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true

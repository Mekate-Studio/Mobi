name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.kotlin-cache
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      shared_tests: ${{ steps.changes.outputs.shared_tests }}
      android_tests: ${{ steps.changes.outputs.android_tests }}
      ios_tests: ${{ steps.changes.outputs.ios_tests }}
      android_build: ${{ steps.changes.outputs.android_build }}
      ios_build: ${{ steps.changes.outputs.ios_build }}
      full_validation: ${{ steps.changes.outputs.full_validation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify changed-path policy
        run: ./scripts/ci/test_classify_changes.sh
      - name: Select validation jobs
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          head_sha="${PR_HEAD_SHA:-${CURRENT_SHA}}"

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi

          ./scripts/ci/classify_changes.sh "${base_sha}" "${head_sha}"
      - name: Summarize selection
        env:
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          SHARED_TESTS: ${{ steps.changes.outputs.shared_tests }}
          ANDROID_TESTS: ${{ steps.changes.outputs.android_tests }}
          IOS_TESTS: ${{ steps.changes.outputs.ios_tests }}
          ANDROID_BUILD: ${{ steps.changes.outputs.android_build }}
          IOS_BUILD: ${{ steps.changes.outputs.ios_build }}
          FULL_VALIDATION: ${{ steps.changes.outputs.full_validation }}
        run: |
          {
            echo "## Validation selection"
            echo
            echo "| Surface | Selected |"
            echo "| --- | --- |"
            echo "| Documentation only | ${DOCS_ONLY} |"
            echo "| Shared tests | ${SHARED_TESTS} |"
            echo "| Android tests | ${ANDROID_TESTS} |"
            echo "| iOS tests | ${IOS_TESTS} |"
            echo "| Android build | ${ANDROID_BUILD} |"
            echo "| iOS build | ${IOS_BUILD} |"
            echo "| Full fallback | ${FULL_VALIDATION} |"
          } >>"${GITHUB_STEP_SUMMARY}"

  quality:
    name: Quality checks
    if: needs.classify.outputs.docs_only != 'true'
    needs: classify
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-${{ runner.arch }}-quality-tools-${{ hashFiles('scripts/ci/install_quality_tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-tools-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install missing quality tools
        run: ./scripts/ci/install_quality_tools.sh
      - name: Run quality checks
        run: ./scripts/ci/run_job.sh quality-check

  android_test:
    name: Android and shared host tests
    if: needs.classify.outputs.android_tests == 'true'
    needs: classify
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .kotlin-cache
            .kotlin-user-home/Library/Caches/JetBrains/Kotlin/.m2.cache
            .gradle-user-home
          key: ${{ runner.os }}-${{ runner.arch }}-host-tests-${{ hashFiles('project.yaml', 'kotlin', 'Gemfile.lock', '.ruby-version', 'gradle/**', 'gradle-bridge/**', '**/module.yaml', 'scripts/ci/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-host-tests-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: android-actions/setup-android@v4
      - name: Run Android and shared tests
        run: ./scripts/ci/run_job.sh android-test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.job }}-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            build/logs
            build/tasks

  ios_test:
    name: iOS PullRequest plan
    if: needs.classify.outputs.ios_tests == 'true'
    needs: classify
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_TEST_PLAN: PullRequest
      KOTLIN_IOS_BUILDER: ${{ vars.KOTLIN_IOS_BUILDER || 'gradle' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .kotlin-cache
            .kotlin-user-home/Library/Caches/JetBrains/Kotlin/.m2.cache
            .gradle-user-home
          key: ${{ runner.os }}-${{ runner.arch }}-ios-tests-${{ hashFiles('project.yaml', 'kotlin', 'Gemfile.lock', '.ruby-version', 'gradle/**', 'gradle-bridge/**', '**/module.yaml', 'ios-app/**', 'shared-*/**', 'scripts/ci/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-tests-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run iOS pull-request tests
        run: ./scripts/ci/run_job.sh ios-test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.job }}-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            build/logs
            build/tasks
            build/test-results

  android_build:
    name: Android debug build
    if: needs.classify.outputs.android_build == 'true'
    needs: classify
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .kotlin-cache
            .kotlin-user-home/Library/Caches/JetBrains/Kotlin/.m2.cache
            .gradle-user-home
          key: ${{ runner.os }}-${{ runner.arch }}-android-build-${{ hashFiles('project.yaml', 'kotlin', 'Gemfile.lock', '.ruby-version', 'gradle/**', 'gradle-bridge/**', '**/module.yaml', 'android-app/**', 'shared-*/**', 'scripts/ci/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-android-build-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: android-actions/setup-android@v4
      - name: Build Android debug
        run: ./scripts/ci/run_job.sh android-build-debug

  ios_build:
    name: iOS debug build
    if: needs.classify.outputs.ios_build == 'true'
    needs: classify
    runs-on: macos-26
    timeout-minutes: 45
    env:
      KOTLIN_IOS_BUILDER: ${{ vars.KOTLIN_IOS_BUILDER || 'gradle' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .kotlin-cache
            .kotlin-user-home/Library/Caches/JetBrains/Kotlin/.m2.cache
            .gradle-user-home
          key: ${{ runner.os }}-${{ runner.arch }}-ios-build-${{ hashFiles('project.yaml', 'kotlin', 'Gemfile.lock', '.ruby-version', 'gradle/**', 'gradle-bridge/**', '**/module.yaml', 'ios-app/**', 'shared-*/**', 'scripts/ci/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-build-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build iOS debug
        run: ./scripts/ci/run_job.sh ios-build-debug

  pr_gate:
    name: Pull request gate
    if: always()
    needs:
      - classify
      - quality
      - android_test
      - ios_test
      - android_build
      - ios_build
    runs-on: ubuntu-slim
    steps:
      - name: Require selected jobs to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ANDROID_TEST_RESULT: ${{ needs.android_test.result }}
          IOS_TEST_RESULT: ${{ needs.ios_test.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          IOS_BUILD_RESULT: ${{ needs.ios_build.result }}
        run: |
          results=(
            "${CLASSIFY_RESULT}"
            "${QUALITY_RESULT}"
            "${ANDROID_TEST_RESULT}"
            "${IOS_TEST_RESULT}"
            "${ANDROID_BUILD_RESULT}"
            "${IOS_BUILD_RESULT}"
          )

          for result in "${results[@]}"; do
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              printf 'Selected validation did not pass: %s\n' "${results[*]}" >&2
              exit 1
            fi
          done

          printf 'Selected validation passed: %s\n' "${results[*]}"

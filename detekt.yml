build:
  maxIssues: 0

comments:
  active: false

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - Preview
  InvalidPackageDeclaration:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false

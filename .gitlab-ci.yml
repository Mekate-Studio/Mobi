spec:
  inputs:
    maintenance_job:
      description: "Select which maintenance task this scheduled pipeline should run."
      options:
        - none
        - bundler
        - amper
      default: none
---
stages:
  - build
  - test
  - internal
  - alpha
  - beta
  - testflight
  - production
  - maintenance

variables:
  AMPER_BOOTSTRAP_CACHE_DIR: "$CI_PROJECT_DIR/.amper-cache"
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"

cache:
  key: amper-cache
  paths:
    - .amper-cache/

.android_job:
  tags:
    - macos

.build_job:
  extends: .android_job
  stage: build
  artifacts:
    paths:
      - build

.ios_job:
  tags:
    - macos
  variables:
    KOTLIN_IOS_BUILDER: "gradle"
    GRADLE_USER_HOME: "$HOME/.gradle-user-home/$CI_PROJECT_PATH_SLUG"

.ios_fastlane_job:
  extends: .ios_job

.ios_testflight_job:
  extends: .ios_fastlane_job

buildDebug:
  extends: .build_job
  script:
    - ./scripts/ci/run_job.sh android-build-debug

buildRelease:
  extends: .build_job
  script:
    - ./scripts/ci/run_job.sh android-build-release
  environment:
    name: production

testDebug:
  extends: .android_job
  stage: test
  dependencies:
    - buildDebug
  script:
    - ./scripts/ci/run_job.sh android-test

iosBuildDebug:
  extends: .ios_job
  stage: build
  script:
    - ./scripts/ci/run_job.sh ios-build-debug
  artifacts:
    paths:
      - build/logs
      - build/xcode-derived-data
      - ios-app/module.xcodeproj

iosBuildRelease:
  extends: .ios_job
  stage: build
  script:
    - ./scripts/ci/run_job.sh ios-build-release
  artifacts:
    paths:
      - build/logs
      - build/xcode-derived-data
      - ios-app/module.xcodeproj

iosArchiveRelease:
  extends: .ios_fastlane_job
  stage: build
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./scripts/ci/run_job.sh ios-archive-release
  artifacts:
    when: always
    paths:
      - build/ios
      - ios-app/module.xcodeproj

iosTestFlight:
  extends: .ios_testflight_job
  stage: testflight
  when: manual
  dependencies:
    - iosArchiveRelease
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./scripts/ci/run_job.sh ios-testflight

.promote_job:
  extends: .android_job
  when: manual
  dependencies: [ ]

publishInternal:
  extends: .promote_job
  stage: internal
  dependencies:
    - buildRelease
  when: manual
  script:
    - ./scripts/ci/run_job.sh publish-internal

promoteAlpha:
  extends: .promote_job
  stage: alpha
  script:
    - ./scripts/ci/run_job.sh promote-alpha

promoteBeta:
  extends: .promote_job
  stage: beta
  script:
    - ./scripts/ci/run_job.sh promote-beta

promoteProduction:
  extends: .promote_job
  stage: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./scripts/ci/run_job.sh promote-production

refreshBundlerLockfile:
  extends: .android_job
  stage: maintenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.maintenance_job ]]" == "bundler"'
  script:
    - ./scripts/maintenance/update_bundler_lockfile.rb
    - ./scripts/ci/run_job.sh android-build-debug
    - >
      ./scripts/maintenance/create_gitlab_maintenance_mr.rb
      --branch chore/dependency-refresh-bundler
      --commit-message "chore(deps): refresh Gemfile.lock"
      --title "chore(deps): refresh Gemfile.lock"
      --description "Automated scheduled Bundler refresh with a portable Android debug smoke test."
      --paths Gemfile.lock

refreshAmperDependencies:
  extends: .android_job
  stage: maintenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.maintenance_job ]]" == "amper"'
  script:
    - ./scripts/maintenance/update_amper_dependencies.rb
    - ./scripts/ci/run_job.sh android-build-debug
    - >
      ./scripts/maintenance/create_gitlab_maintenance_mr.rb
      --branch chore/dependency-refresh-amper
      --commit-message "chore(amper): refresh Android dependency versions"
      --title "chore(amper): refresh Android dependency versions"
      --description "Automated scheduled Amper dependency refresh with a portable Android debug smoke test."
      --paths android-app/module.yaml

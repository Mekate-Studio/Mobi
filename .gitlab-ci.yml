stages:
  - environment
  - build
  - test
  - internal
  - alpha
  - beta
  - production

variables:
  AMPER_BOOTSTRAP_CACHE_DIR: "$CI_PROJECT_DIR/.amper-cache"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

cache:
  key: amper-cache
  paths:
    - .amper-cache/


.updateContainerJob:
  image: docker:27.3.1
  stage: environment
  services:
    - name: docker:27.3.1-dind
      alias: docker
  script:
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

updateContainer:
  extends: .updateContainerJob
  only:
    changes:
      - Dockerfile

ensureContainer:
  extends: .updateContainerJob
  allow_failure: true
  before_script:
    - "mkdir -p ~/.docker && echo '{\"experimental\": \"enabled\"}' > ~/.docker/config.json"
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    # Skip update container `script` if the container already exists
    # via https://gitlab.com/gitlab-org/gitlab-ce/issues/26866#note_97609397 -> https://stackoverflow.com/a/52077071/796832
    - docker manifest inspect $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG > /dev/null && exit || true
  except:
    changes:
      - Dockerfile


.android_job:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - mkdir -p "$AMPER_BOOTSTRAP_CACHE_DIR"
    - chmod +x amper scripts/ci/*.sh
    - export VERSION_CODE="${CI_PIPELINE_IID:-1}"
    - export VERSION_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VERSION_NAME="1.0-${VERSION_SHA}"
    - ./scripts/ci/apply_android_version.sh

.build_job:
  extends: .android_job
  stage: build
  artifacts:
    paths:
      - build

.release_job:
  extends: .build_job
  before_script:
    - mkdir -p "$AMPER_BOOTSTRAP_CACHE_DIR"
    - chmod +x amper scripts/ci/*.sh
    - export VERSION_CODE="${CI_PIPELINE_IID:-1}"
    - export VERSION_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VERSION_NAME="1.0-${VERSION_SHA}"
    - ./scripts/ci/apply_android_version.sh
    - ./scripts/ci/write_android_signing_files.sh

buildDebug:
  extends: .build_job
  script:
    - bundle exec fastlane buildDebug

buildRelease:
  extends: .release_job
  script:
    - bundle exec fastlane buildRelease
  environment:
    name: production

testDebug:
  extends: .android_job
  stage: test
  dependencies:
    - buildDebug
  script:
    - bundle exec fastlane test

.promote_job:
  extends: .android_job
  when: manual
  dependencies: [ ]
  before_script:
    - mkdir -p "$AMPER_BOOTSTRAP_CACHE_DIR"
    - chmod +x amper scripts/ci/*.sh
    - export VERSION_CODE="${CI_PIPELINE_IID:-1}"
    - export VERSION_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VERSION_NAME="1.0-${VERSION_SHA}"
    - ./scripts/ci/apply_android_version.sh
    - export GOOGLE_PLAY_JSON_KEY_FILE="$CI_PROJECT_DIR/google_play_api_key.json"
    - ./scripts/ci/write_google_play_key.sh "$GOOGLE_PLAY_JSON_KEY_FILE" > /dev/null
  after_script:
    - rm -f "$CI_PROJECT_DIR/google_play_api_key.json"

publishInternal:
  extends: .promote_job
  stage: internal
  dependencies:
    - buildRelease
  when: manual
  script:
    - bundle exec fastlane internal

promoteAlpha:
  extends: .promote_job
  stage: alpha
  script:
    - bundle exec fastlane promote_internal_to_alpha

promoteBeta:
  extends: .promote_job
  stage: beta
  script:
    - bundle exec fastlane promote_alpha_to_beta

promoteProduction:
  extends: .promote_job
  stage: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bundle exec fastlane promote_beta_to_production

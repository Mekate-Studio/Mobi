stages:
  - build
  - test
  - internal
  - alpha
  - beta
  - production

variables:
  AMPER_BOOTSTRAP_CACHE_DIR: "$CI_PROJECT_DIR/.amper-cache"
  PATH: "/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  GEM_HOME: "/opt/homebrew/lib/ruby/gems/4.0.0"
  GEM_PATH: "/opt/homebrew/lib/ruby/gems/4.0.0"

cache:
  key: amper-cache
  paths:
    - .amper-cache/


.android_job:
  tags:
    - macos
  before_script:
    - mkdir -p "$AMPER_BOOTSTRAP_CACHE_DIR"
    - chmod +x amper scripts/ci/*.sh
    - ruby --version
    - bundle --version
    - bundle install
    - export VERSION_CODE="${CI_PIPELINE_IID:-1}"
    - export VERSION_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VERSION_NAME="1.0-${VERSION_SHA}"
    - ./scripts/ci/apply_android_version.sh
    - if [ -n "${ANDROID_KEYSTORE_FILE:-}" ] || [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then ./scripts/ci/write_android_signing_files.sh; fi

.build_job:
  extends: .android_job
  stage: build
  artifacts:
    paths:
      - build

.release_job:
  extends: .build_job

buildDebug:
  extends: .build_job
  script:
    - ./scripts/ci/run_fastlane_with_amper_logs.sh buildDebug

buildRelease:
  extends: .release_job
  script:
    - ./scripts/ci/run_fastlane_with_amper_logs.sh buildRelease
  environment:
    name: production

testDebug:
  extends: .android_job
  stage: test
  dependencies:
    - buildDebug
  script:
    - ./scripts/ci/run_fastlane_with_amper_logs.sh test

.promote_job:
  extends: .android_job
  when: manual
  dependencies: [ ]
  before_script:
    - mkdir -p "$AMPER_BOOTSTRAP_CACHE_DIR"
    - chmod +x amper scripts/ci/*.sh
    - export VERSION_CODE="${CI_PIPELINE_IID:-1}"
    - export VERSION_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VERSION_NAME="1.0-${VERSION_SHA}"
    - ./scripts/ci/apply_android_version.sh
    - export GOOGLE_PLAY_JSON_KEY_FILE="$CI_PROJECT_DIR/google_play_api_key.json"
    - ./scripts/ci/write_google_play_key.sh "$GOOGLE_PLAY_JSON_KEY_FILE" > /dev/null
  after_script:
    - rm -f "$CI_PROJECT_DIR/google_play_api_key.json"

publishInternal:
  extends: .promote_job
  stage: internal
  dependencies:
    - buildRelease
  when: manual
  script:
    - bundle exec fastlane internal

promoteAlpha:
  extends: .promote_job
  stage: alpha
  script:
    - bundle exec fastlane promote_internal_to_alpha

promoteBeta:
  extends: .promote_job
  stage: beta
  script:
    - bundle exec fastlane promote_alpha_to_beta

promoteProduction:
  extends: .promote_job
  stage: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bundle exec fastlane promote_beta_to_production

import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest
import java.nio.file.Files

// Resolution in an executor-owned copy. Authored files and repository pins are
// unchanged. Existing SwiftPM metadata producers run before their project
// outputs are fingerprinted. Output contains no absolute cache paths/messages.
def attributes = { attrs ->
    attrs.keySet().sort { it.name }.collectEntries { key -> [(key.name): attrs.getAttribute(key).toString()] }
}
def component = { id ->
    id instanceof ModuleComponentIdentifier ?
        [kind: 'maven', group: id.group, name: id.module, version: id.version] :
        [kind: 'project', id: id.displayName]
}
def digest = { file ->
    def md = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) { md.update(buffer, 0, count) }
    }
    md.digest().encodeHex().toString()
}


def artifactIdentity = { file ->
    if (file.isFile()) { return [kind: 'file', sha256: digest(file), bytes: file.length()] }
    if (!file.isDirectory()) { throw new IllegalStateException('Missing resolved artifact') }
    def root = file.toPath().toRealPath()
    def entries = []
    long bytes = 0
    def stream = Files.walk(root)
    try {
        stream.sorted().forEach { path ->
            def name = root.relativize(path).toString()
            if (Files.isSymbolicLink(path)) {
                def target = path.parent.resolve(Files.readSymbolicLink(path)).normalize()
                if (!target.startsWith(root)) { throw new IllegalStateException('Artifact symlink escapes bundle') }
                entries.add([name: name, kind: 'symlink', target: root.relativize(target).toString()])
            } else if (Files.isRegularFile(path)) {
                entries.add([name: name, kind: 'file', sha256: digest(path.toFile()), executable: Files.isExecutable(path)])
                bytes += Files.size(path)
            } else if (!Files.isDirectory(path)) {
                throw new IllegalStateException('Unsupported bundle entry')
            }
        }
    } finally { stream.close() }
    if (entries.isEmpty()) { throw new IllegalStateException('Empty resolved bundle') }
    def sha = MessageDigest.getInstance('SHA-256').digest(JsonOutput.toJson(entries).getBytes('UTF-8')).encodeHex().toString()
    [kind: 'directory', sha256: sha, bytes: bytes, entries: entries.size, digest_format: 'sorted_relative_file_hashes_and_symlinks_v1']
}

gradle.projectsEvaluated {
    rootProject.tasks.register('mobiResolutionEvidence') {
        // Kotlin 2.4 exposes a project-produced lock-file metadata artifact.
        // Resolving a configuration alone does not execute its producer.
        rootProject.allprojects.each { project ->
            dependsOn(project.tasks.matching { it.name == 'serializeSwiftPMDependenciesMetadataForLockFiles' })
        }
        doLast {
            def rows = []
            rootProject.allprojects.sort { it.path }.each { project ->
                [project: project.configurations, buildscript: project.buildscript.configurations].each { owner, configs ->
                    configs.sort { it.name }.each { cfg ->
                        def row = [project: project.path, owner: owner, configuration: cfg.name,
                                   resolvable: cfg.canBeResolved, attributes: attributes(cfg.attributes)]
                        if (cfg.canBeResolved) {
                            try {
                                def result = cfg.incoming.resolutionResult
                                row.nodes = result.allComponents.collect { node ->
                                    [component: component(node.id), variants: node.variants.collect { variant ->
                                        [name: variant.displayName, attributes: attributes(variant.attributes)]
                                    }]
                                }.sort { JsonOutput.toJson(it.component) }
                                row.edges = result.allDependencies.collect { dep ->
                                    def edge = [from: component(dep.from.id), requested: dep.requested.displayName]
                                    if (dep instanceof ResolvedDependencyResult) {
                                        edge.selected = component(dep.selected.id)
                                        edge.variant = [name: dep.resolvedVariant.displayName, attributes: attributes(dep.resolvedVariant.attributes)]
                                    } else {
                                        edge.failure = dep.failure.class.simpleName
                                    }
                                    edge
                                }.sort { JsonOutput.toJson(it) }
                                def artifacts = cfg.incoming.artifacts
                                row.failures = artifacts.failures.collect { it.class.simpleName }.unique().sort()
                                row.artifacts = artifacts.artifacts.collect { artifact ->
                                    [component: component(artifact.id.componentIdentifier), name: artifact.file.name,
                                     variant: [name: artifact.variant.displayName, attributes: attributes(artifact.variant.attributes)],
                                     identity: artifactIdentity(artifact.file)]
                                }.sort { JsonOutput.toJson(it.component) + it.name }
                                row.state = row.failures.isEmpty() && !row.edges.any { it.failure } ? 'resolved' : 'incomplete'
                            } catch (Exception error) {
                                row.state = 'incomplete'
                                row.failure = error.class.simpleName
                            }
                        } else {
                            row.state = 'not_resolvable'
                        }
                        rows.add(row)
                    }
                }
            }
            println('MOBI_RESOLUTION_JSON=' + JsonOutput.toJson([schema: 1, gradle: gradle.gradleVersion, configurations: rows]))
            if (rows.any { it.state == 'incomplete' }) {
                throw new GradleException('Mobi resolution evidence is incomplete')
            }
        }
    }
}
